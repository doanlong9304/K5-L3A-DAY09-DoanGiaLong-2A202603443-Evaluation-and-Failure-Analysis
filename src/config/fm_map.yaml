# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in
# docs/failure_taxonomy.md. Every mechanism maps to an existing FM; no new FM was needed.
ticket_over_db: FM-03          # [SYSTEM] delay_days=6 / "trễ 8 ngày" in the ticket vs the DB row
stale_policy: FM-06            # cites SHIP-LATE-OLD (superseded) or SHIP-LATE-FUTURE (not yet effective)
clause_sum: FM-04              # "cộng cả hai khoản": ship + damage summed instead of max
double_deduct: FM-05           # order already refunded: the agent subtracts, then the host subtracts again
sibling_refund: FM-07          # "gom đơn": refund every claim on the order at once
